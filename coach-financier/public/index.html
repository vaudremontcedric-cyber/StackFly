<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Coach Financier" />
  <title>Coach Financier IA</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #16213e;
      --accent: #6c63ff;
      --accent2: #a78bfa;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
      --text: #f1f5f9;
      --text2: #94a3b8;
      --border: #2d2d4a;
      --card: #1e1e35;
      --radius: 16px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html, body {
      height: 100%; width: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ── App Shell ── */
    #app {
      display: flex; flex-direction: column;
      height: 100dvh; width: 100%;
      position: relative; overflow: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      padding-top: calc(12px + env(safe-area-inset-top, 0px));
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0; z-index: 10;
    }
    .header-logo {
      display: flex; align-items: center; gap: 10px;
    }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .logo-text { font-weight: 700; font-size: 17px; }
    .logo-sub { font-size: 11px; color: var(--text2); }
    .header-badge {
      background: var(--green); color: white;
      font-size: 10px; font-weight: 700;
      padding: 3px 8px; border-radius: 20px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    /* ── Pages ── */
    .page {
      display: none; flex-direction: column;
      flex: 1; overflow: hidden; min-height: 0;
    }
    .page.active { display: flex; }

    /* ── Chat Page ── */
    #page-chat { flex-direction: column; }

    .chat-messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .msg {
      max-width: 85%; display: flex; flex-direction: column; gap: 4px;
      animation: fadeUp 0.3s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }

    .msg-bubble {
      padding: 12px 14px; border-radius: 18px;
      line-height: 1.5; font-size: 15px;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg.user .msg-bubble {
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: white; border-bottom-right-radius: 4px;
    }
    .msg.assistant .msg-bubble {
      background: var(--card); color: var(--text);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border);
    }

    .msg-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; margin-bottom: 2px;
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex; gap: 4px; align-items: center;
      padding: 12px 14px; background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px; border-bottom-left-radius: 4px;
      width: fit-content;
    }
    .typing-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text2); animation: bounce 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Chat input */
    .chat-input-area {
      padding: 12px 12px;
      padding-bottom: calc(12px + var(--safe-bottom));
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex; gap: 8px; align-items: flex-end;
    }
    .chat-input {
      flex: 1; background: var(--card); border: 1px solid var(--border);
      border-radius: 22px; padding: 10px 16px;
      color: var(--text); font-size: 15px; resize: none;
      outline: none; max-height: 120px; min-height: 42px;
      font-family: inherit; line-height: 1.4;
      transition: border-color 0.2s;
    }
    .chat-input:focus { border-color: var(--accent); }
    .chat-input::placeholder { color: var(--text2); }
    .send-btn {
      width: 42px; height: 42px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: transform 0.15s, opacity 0.15s;
    }
    .send-btn:active { transform: scale(0.92); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .send-btn svg { width: 18px; height: 18px; fill: white; }

    /* ── Dashboard Page ── */
    #page-dashboard {
      overflow-y: auto; padding: 16px;
      padding-bottom: calc(16px + var(--safe-bottom));
      -webkit-overflow-scrolling: touch;
      gap: 16px;
    }

    .dash-greeting {
      font-size: 22px; font-weight: 700; margin-bottom: 4px;
    }
    .dash-sub { font-size: 14px; color: var(--text2); }

    /* Carte RAV principale */
    .rav-card {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
      border: 1px solid #4338ca44;
      border-radius: var(--radius); padding: 20px;
      text-align: center; position: relative; overflow: hidden;
    }
    .rav-card::before {
      content: ''; position: absolute; top: -40px; right: -40px;
      width: 120px; height: 120px; border-radius: 50%;
      background: rgba(139,92,246,0.15);
    }
    .rav-label { font-size: 12px; color: #a5b4fc; text-transform: uppercase; letter-spacing: 1px; }
    .rav-amount {
      font-size: 42px; font-weight: 800; margin: 8px 0;
      background: linear-gradient(135deg, #c4b5fd, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .rav-status {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 20px;
      font-size: 13px; font-weight: 600;
    }
    .rav-status.good { background: rgba(16,185,129,0.2); color: var(--green); }
    .rav-status.warn { background: rgba(245,158,11,0.2); color: var(--yellow); }
    .rav-status.bad  { background: rgba(239,68,68,0.2);  color: var(--red); }

    /* Cartes revenus/dépenses */
    .metrics-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .metric-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
    }
    .metric-icon {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; margin-bottom: 10px;
    }
    .metric-icon.green { background: rgba(16,185,129,0.15); }
    .metric-icon.red   { background: rgba(239,68,68,0.15); }
    .metric-label { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
    .metric-value { font-size: 22px; font-weight: 700; }
    .metric-value.green { color: var(--green); }
    .metric-value.red   { color: var(--red); }

    /* Barre de budget */
    .budget-bar-section {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
    }
    .section-title {
      font-size: 14px; font-weight: 600; margin-bottom: 14px;
      color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px;
    }
    .budget-bar-wrap { margin-bottom: 12px; }
    .budget-bar-label {
      display: flex; justify-content: space-between;
      font-size: 13px; margin-bottom: 6px;
    }
    .budget-bar-track {
      height: 8px; background: var(--border);
      border-radius: 4px; overflow: hidden;
    }
    .budget-bar-fill {
      height: 100%; border-radius: 4px;
      transition: width 0.8s cubic-bezier(.4,0,.2,1);
    }
    .budget-bar-fill.green { background: var(--green); }
    .budget-bar-fill.yellow { background: var(--yellow); }
    .budget-bar-fill.red { background: var(--red); }

    /* Objectif */
    .objectif-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
    }
    .objectif-text {
      font-size: 15px; margin-bottom: 12px; line-height: 1.5;
    }
    .objectif-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(108,99,255,0.15); color: var(--accent2);
      padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600;
    }

    /* Vide state */
    .dash-empty {
      text-align: center; padding: 40px 20px;
    }
    .dash-empty-icon { font-size: 48px; margin-bottom: 16px; }
    .dash-empty-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .dash-empty-text { font-size: 14px; color: var(--text2); line-height: 1.6; }
    .go-chat-btn {
      margin-top: 20px; padding: 12px 24px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: white; border: none; border-radius: 22px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s;
    }
    .go-chat-btn:active { opacity: 0.8; }

    /* ── Objectifs Page ── */
    #page-objectifs {
      overflow-y: auto; padding: 16px;
      padding-bottom: calc(16px + var(--safe-bottom));
      gap: 16px;
    }
    .objectifs-header {
      display: flex; justify-content: space-between; align-items: center;
    }
    .page-title { font-size: 22px; font-weight: 700; }
    .add-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--accent); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 22px; font-weight: 300;
      transition: transform 0.15s;
    }
    .add-btn:active { transform: scale(0.9); }

    .objectif-item {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
      display: flex; align-items: center; gap: 14px;
    }
    .objectif-check {
      width: 28px; height: 28px; border-radius: 50%;
      border: 2px solid var(--border); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.2s;
    }
    .objectif-check.done {
      border-color: var(--green); background: var(--green);
    }
    .objectif-content { flex: 1; }
    .objectif-title-txt { font-size: 15px; font-weight: 600; }
    .objectif-desc { font-size: 13px; color: var(--text2); margin-top: 2px; }
    .objectif-del {
      background: none; border: none; color: var(--text2);
      cursor: pointer; font-size: 18px; padding: 4px;
    }

    .empty-objectifs {
      text-align: center; padding: 40px 20px;
    }

    /* Modal ajout objectif */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      align-items: flex-end; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border-radius: 24px 24px 0 0;
      padding: 24px 20px; padding-bottom: calc(24px + var(--safe-bottom));
      width: 100%; max-width: 500px;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .modal-input {
      width: 100%; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px; color: var(--text);
      font-size: 15px; outline: none; font-family: inherit;
      margin-bottom: 12px;
    }
    .modal-input:focus { border-color: var(--accent); }
    .modal-btns { display: flex; gap: 10px; margin-top: 4px; }
    .modal-btn {
      flex: 1; padding: 12px; border-radius: 12px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      border: none; transition: opacity 0.2s;
    }
    .modal-btn:active { opacity: 0.8; }
    .modal-btn.primary { background: var(--accent); color: white; }
    .modal-btn.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }

    /* ── Bottom Nav ── */
    .bottom-nav {
      display: flex; background: var(--surface);
      border-top: 1px solid var(--border); flex-shrink: 0;
      padding-bottom: var(--safe-bottom);
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; padding: 10px 0;
      cursor: pointer; border: none; background: none;
      color: var(--text2); transition: color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-item.active { color: var(--accent); }
    .nav-icon { font-size: 22px; margin-bottom: 3px; }
    .nav-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Scrollbar invisible */
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }

    /* Notification toast */
    .toast {
      position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
      background: var(--green); color: white;
      padding: 10px 20px; border-radius: 20px;
      font-size: 14px; font-weight: 600; z-index: 200;
      opacity: 0; transition: opacity 0.3s;
      white-space: nowrap; pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <header class="header">
    <div class="header-logo">
      <div class="logo-icon">💰</div>
      <div>
        <div class="logo-text">Coach Financier</div>
        <div class="logo-sub">Ton assistant personnel</div>
      </div>
    </div>
    <span class="header-badge">Bêta</span>
  </header>

  <!-- Page Chat -->
  <section id="page-chat" class="page active">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <textarea
        id="chatInput"
        class="chat-input"
        placeholder="Écris ton message..."
        rows="1"
        maxlength="1000"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </section>

  <!-- Page Dashboard -->
  <section id="page-dashboard" class="page">
    <div id="dashContent"></div>
  </section>

  <!-- Page Objectifs -->
  <section id="page-objectifs" class="page">
    <div class="objectifs-header">
      <h1 class="page-title">Mes objectifs</h1>
      <button class="add-btn" onclick="openModal()">+</button>
    </div>
    <div id="objectifsList"></div>
  </section>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="showPage('chat')" id="nav-chat">
      <span class="nav-icon">💬</span>
      <span class="nav-label">Coach</span>
    </button>
    <button class="nav-item" onclick="showPage('dashboard')" id="nav-dashboard">
      <span class="nav-icon">📊</span>
      <span class="nav-label">Budget</span>
    </button>
    <button class="nav-item" onclick="showPage('objectifs')" id="nav-objectifs">
      <span class="nav-icon">🎯</span>
      <span class="nav-label">Objectifs</span>
    </button>
  </nav>
</div>

<!-- Modal ajout objectif -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-title">Nouvel objectif</div>
    <input type="text" class="modal-input" id="objTitle" placeholder="Ex : Réduire les restaurants" maxlength="60" />
    <input type="text" class="modal-input" id="objDesc" placeholder="Détail (optionnel)" maxlength="100" />
    <div class="modal-btns">
      <button class="modal-btn secondary" onclick="closeModal()">Annuler</button>
      <button class="modal-btn primary" onclick="addObjectif()">Ajouter ✓</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ─── État global ─────────────────────────────────────────────────────────────
const state = {
  history: JSON.parse(localStorage.getItem('cf_history') || '[]'),
  financial: JSON.parse(localStorage.getItem('cf_financial') || 'null') || {},
  objectifs: JSON.parse(localStorage.getItem('cf_objectifs') || '[]'),
  isLoading: false
};

// ─── Utilitaires ─────────────────────────────────────────────────────────────
function save() {
  localStorage.setItem('cf_history', JSON.stringify(state.history.slice(-40)));
  localStorage.setItem('cf_financial', JSON.stringify(state.financial));
  localStorage.setItem('cf_objectifs', JSON.stringify(state.objectifs));
}

function formatEuro(n) {
  if (n == null || isNaN(n)) return '—';
  return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(n);
}

function showToast(msg, color = '#10b981') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = color;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── Navigation ───────────────────────────────────────────────────────────────
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  if (name === 'dashboard') renderDashboard();
  if (name === 'objectifs') renderObjectifs();
}

// ─── Chat ─────────────────────────────────────────────────────────────────────
const chatEl = document.getElementById('chatMessages');
const inputEl = document.getElementById('chatInput');
const sendEl  = document.getElementById('sendBtn');

// Auto-resize textarea
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

// Enter = envoyer (shift+enter = nouvelle ligne)
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function appendMsg(role, text) {
  const isUser = role === 'user';
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = isUser
    ? `<div class="msg-bubble">${escHtml(text)}</div>`
    : `<div class="msg-avatar">🤖</div><div class="msg-bubble">${formatMarkdown(text)}</div>`;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg assistant'; div.id = 'typing';
  div.innerHTML = `<div class="msg-avatar">🤖</div><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function hideTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || state.isLoading) return;

  inputEl.value = ''; inputEl.style.height = 'auto';
  sendEl.disabled = true; state.isLoading = true;
  appendMsg('user', text);
  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: state.history })
    });
    const data = await res.json();
    hideTyping();

    if (!res.ok) throw new Error(data.error || 'Erreur serveur');

    appendMsg('assistant', data.message);
    state.history.push({ role: 'user', content: text });
    state.history.push({ role: 'assistant', content: data.message });

    // Mettre à jour les données financières si détectées
    if (data.financialData) {
      Object.entries(data.financialData).forEach(([k, v]) => {
        if (v !== null) state.financial[k] = v;
      });
      if (Object.keys(state.financial).length > 0) {
        showToast('📊 Dashboard mis à jour !');
      }
    }
    save();
  } catch (err) {
    hideTyping();
    appendMsg('assistant', '⚠️ Une erreur est survenue. Vérifie ta connexion et réessaie.');
    console.error(err);
  } finally {
    sendEl.disabled = false; state.isLoading = false;
    chatEl.scrollTop = chatEl.scrollHeight;
  }
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function formatMarkdown(s) {
  return escHtml(s)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>');
}

// ─── Dashboard ─────────────────────────────────────────────────────────────────
function renderDashboard() {
  const el = document.getElementById('dashContent');
  const f = state.financial;
  const hasData = f.revenus || f.depenses;

  if (!hasData) {
    el.innerHTML = `
      <div class="dash-empty">
        <div class="dash-empty-icon">💬</div>
        <div class="dash-empty-title">Commence par parler à ton coach</div>
        <div class="dash-empty-text">Dis-lui ton revenu mensuel et tes dépenses. Il analysera ta situation et le dashboard se remplira automatiquement.</div>
        <button class="go-chat-btn" onclick="showPage('chat')">Parler au coach →</button>
      </div>`;
    return;
  }

  const rev = f.revenus || 0;
  const dep = f.depenses || 0;
  const rav = f.reste_a_vivre || (rev - dep);
  const pct = rev > 0 ? Math.min(100, Math.round((dep / rev) * 100)) : 0;
  const color = pct < 70 ? 'green' : pct < 90 ? 'yellow' : 'red';
  const status = pct < 70 ? 'Situation saine ✓' : pct < 90 ? 'Attention requise' : 'Zone de risque';

  el.innerHTML = `
    <div class="dash-greeting">Ton budget 📈</div>
    <div class="dash-sub">Mis à jour depuis ta conversation</div>

    <div class="rav-card" style="margin-top:16px">
      <div class="rav-label">Reste à vivre estimé</div>
      <div class="rav-amount">${formatEuro(rav)}</div>
      <div class="rav-status ${color}">${status}</div>
    </div>

    <div class="metrics-row" style="margin-top:12px">
      <div class="metric-card">
        <div class="metric-icon green">💚</div>
        <div class="metric-label">Revenus</div>
        <div class="metric-value green">${formatEuro(rev)}</div>
      </div>
      <div class="metric-card">
        <div class="metric-icon red">🔴</div>
        <div class="metric-label">Dépenses</div>
        <div class="metric-value red">${formatEuro(dep)}</div>
      </div>
    </div>

    <div class="budget-bar-section" style="margin-top:12px">
      <div class="section-title">Utilisation du budget</div>
      <div class="budget-bar-wrap">
        <div class="budget-bar-label">
          <span>Dépenses</span>
          <span>${pct}%</span>
        </div>
        <div class="budget-bar-track">
          <div class="budget-bar-fill ${color}" style="width:${pct}%"></div>
        </div>
      </div>
      ${f.epargne ? `
      <div class="budget-bar-wrap">
        <div class="budget-bar-label">
          <span>Épargne</span>
          <span>${formatEuro(f.epargne)}</span>
        </div>
        <div class="budget-bar-track">
          <div class="budget-bar-fill green" style="width:${Math.min(100, Math.round((f.epargne/rev)*100))}%"></div>
        </div>
      </div>` : ''}
    </div>

    ${f.objectif ? `
    <div class="objectif-card" style="margin-top:12px">
      <div class="section-title">Objectif du coach</div>
      <div class="objectif-text">${escHtml(f.objectif)}</div>
      <span class="objectif-badge">🎯 Cette semaine</span>
    </div>` : ''}
  `;
}

// ─── Objectifs ────────────────────────────────────────────────────────────────
function renderObjectifs() {
  const el = document.getElementById('objectifsList');
  if (state.objectifs.length === 0) {
    el.innerHTML = `<div class="empty-objectifs"><div style="font-size:48px;margin-bottom:16px">🎯</div><div style="font-weight:600;font-size:18px;margin-bottom:8px">Aucun objectif</div><div style="color:var(--text2);font-size:14px">Ajoute un objectif simple pour cette semaine.<br>Ex : "Pas de restaurant cette semaine"</div></div>`;
    return;
  }
  el.innerHTML = state.objectifs.map((o, i) => `
    <div class="objectif-item" style="margin-bottom:10px">
      <div class="objectif-check ${o.done ? 'done' : ''}" onclick="toggleObj(${i})">
        ${o.done ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M20 6L9 17l-5-5"/></svg>' : ''}
      </div>
      <div class="objectif-content">
        <div class="objectif-title-txt" style="${o.done ? 'text-decoration:line-through;opacity:0.5' : ''}">${escHtml(o.title)}</div>
        ${o.desc ? `<div class="objectif-desc">${escHtml(o.desc)}</div>` : ''}
      </div>
      <button class="objectif-del" onclick="delObj(${i})">×</button>
    </div>
  `).join('');
}

function toggleObj(i) {
  state.objectifs[i].done = !state.objectifs[i].done;
  if (state.objectifs[i].done) showToast('🎉 Objectif accompli !');
  save(); renderObjectifs();
}

function delObj(i) {
  state.objectifs.splice(i, 1);
  save(); renderObjectifs();
}

function openModal() {
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('objTitle').focus(), 300);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('objTitle').value = '';
  document.getElementById('objDesc').value = '';
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

function addObjectif() {
  const title = document.getElementById('objTitle').value.trim();
  if (!title) return;
  state.objectifs.push({ title, desc: document.getElementById('objDesc').value.trim(), done: false });
  save(); closeModal(); renderObjectifs();
  showToast('✅ Objectif ajouté !');
}

// ─── Init ─────────────────────────────────────────────────────────────────────
function init() {
  // Afficher l'historique des messages
  if (state.history.length === 0) {
    appendMsg('assistant', 'Bonjour ! 👋\n\nJe suis ton coach financier personnel.\n\nPour t\'aider simplement, dis-moi environ combien tu gagnes par mois ?');
  } else {
    state.history.forEach(m => appendMsg(m.role, m.content));
    chatEl.scrollTop = chatEl.scrollHeight;
  }
}

// ─── PWA Service Worker ───────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

init();
</script>
</body>
</html>
